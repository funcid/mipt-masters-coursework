services:
  db:
    image: postgres:16
    container_name: notes-db
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d notes_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: notes-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
