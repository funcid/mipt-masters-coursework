services:
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5543:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5544:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    build:
      context: ./microservices/catalog
    environment:
      DATABASE_URL: postgresql+asyncpg://catalog:catalog@catalog-db:5432/catalog_db
      JWT_SECRET: super-secret-key
      JWT_ALGORITHM: HS256
      INTERNAL_SERVICE_TOKEN: internal-service-token
    ports:
      - "8001:8000"
    depends_on:
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: ./microservices/order
    environment:
      DATABASE_URL: postgresql+asyncpg://orders:orders@order-db:5432/order_db
      CATALOG_SERVICE_URL: http://catalog-service:8000
      JWT_SECRET: super-secret-key
      JWT_ALGORITHM: HS256
      INTERNAL_SERVICE_TOKEN: internal-service-token
    ports:
      - "8002:8000"
    depends_on:
      order-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

  auth-service:
    build:
      context: ./microservices/auth
    environment:
      JWT_SECRET: super-secret-key
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "120"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin123!
    ports:
      - "8005:8000"

  admin-panel:
    build:
      context: ./microservices/admin-panel
    ports:
      - "8100:8000"
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_started

volumes:
  catalog-db-data:
  order-db-data:
