services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      args:
        SERVICE: migrate
    env_file: .env
    environment:
      POSTGRES_DSN: postgres://expense:expense@postgres:5432/expense?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: .
      args:
        SERVICE: auth
    env_file: .env
    environment:
      AUTH_GRPC_ADDR: ":9092"
      POSTGRES_DSN: postgres://expense:expense@postgres:5432/expense?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    restart: unless-stopped

  ledger:
    build:
      context: .
      args:
        SERVICE: ledger
    env_file: .env
    environment:
      LEDGER_GRPC_ADDR: ":9091"
      POSTGRES_DSN: postgres://expense:expense@postgres:5432/expense?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "9091:9091"
    restart: unless-stopped

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    env_file: .env
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      LEDGER_GRPC_ADDR: ledger:9091
      AUTH_GRPC_ADDR: auth:9092
    depends_on:
      - auth
      - ledger
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
